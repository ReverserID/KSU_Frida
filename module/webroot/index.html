<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frida-ksu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: monospace; background: #111; color: #e0e0e0; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .k { color: #888; } .v { color: #fff; }
  .ok { color: #4caf50; font-weight: bold; } .bad { color: #f44336; font-weight: bold; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button { flex: 1 1 30%; padding: 10px 4px; border-radius: 8px; border: 1px solid #444;
           background: #2a2a2a; color: #fff; font-family: monospace; font-size: 13px; }
  button:active { background: #3a3a3a; }
  button.warn { border-color: #7a4a00; } button.go { border-color: #1b5e20; }
  input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
          background: #111; color: #fff; font-family: monospace; font-size: 13px; margin-bottom: 8px; }
  pre { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 10px;
        font-size: 11px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .art { color: #888; font-size: 10px; line-height: 1.2; margin-bottom: 12px; }
</style>
</head>
<body>
<pre class="art">   ▄██▄    reverser.id
 ▄██████▄  frida-ksu</pre>
<img src="icon.png" width="64" height="64" style="border-radius:14px">
<h1>frida-ksu</h1>
<div class="sub">frida-server manager</div>

<div class="card" id="status">
  <div class="row"><span class="k">bridge</span><span class="v" id="s-bridge">…</span></div>
  <div class="row"><span class="k">installed</span><span class="v" id="s-ver">…</span></div>
  <div class="row"><span class="k">upstream</span><span class="v" id="s-latest">…</span></div>
  <div class="row"><span class="k">daemon</span><span class="v" id="s-run">…</span></div>
  <div class="row"><span class="k">listening</span><span class="v" id="s-listen">…</span></div>
</div>

<div class="card">
  <div class="btns">
    <button class="go" onclick="svc('start')">start</button>
    <button class="warn" onclick="svc('stop')">stop</button>
    <button onclick="svc('restart')">restart</button>
    <button class="go" onclick="update()">update</button>
    <button onclick="refresh()">refresh</button>
  </div>
</div>

<div class="card">
  <div class="row"><span class="k">listen address</span></div>
  <input id="listen" placeholder="127.0.0.1:27042">
  <div class="btns"><button onclick="saveListen()">save + restart</button></div>
</div>

<div class="card">
  <div class="row"><span class="k">log</span><span class="k" onclick="loadLog()">tap to reload</span></div>
  <pre id="log">…</pre>
</div>

<pre id="out"></pre>

<script>
var MOD = '/data/adb/modules/frida-ksu';
// Stock manager injects window.kernelsu; forks/wrappers use other names.
var BRIDGE = (function () {
  var names = ['kernelsu', 'mmrl', 'apatch', 'KernelSU', 'ksu'];
  for (var i = 0; i < names.length; i++) {
    var a = window[names[i]];
    if (a && a.exec) return { name: names[i], api: a };
  }
  return null;
})();
var K = BRIDGE ? BRIDGE.api : null;
var KNAME = BRIDGE ? BRIDGE.name : 'missing';
function toast(m) { if (K && K.toast) { try { K.toast(m); } catch (e) {} } }
function say(t) { document.getElementById('out').textContent = t; }
// Works with every bridge shape: sync string, sync {errno,stdout},
// or Promise of either (some managers resolve async).
function sh(cmd) {
  if (!K || !K.exec) return Promise.resolve(null);
  var r;
  try { r = K.exec(cmd); } catch (e) { return Promise.resolve('ERR:' + e); }
  return Promise.resolve(r).then(function (v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') {
      if (typeof v.stdout === 'string') return v.stdout;
      if (typeof v.result === 'string') return v.result;
      if (typeof v.output === 'string') return v.output;
      try { return JSON.stringify(v); } catch (e) { return '' + v; }
    }
    return '' + v;
  }, function (e) { return 'ERR:' + e; });
}

function refresh() {
  if (!K || !K.exec) {
    say('no kernelsu bridge (open in manager WebUI)');
    var names = [];
    for (var k in window) { try { if (window[k] && window[k].exec) names.push(k); } catch (e) {} }
    document.getElementById('s-bridge').textContent =
      'missing (exec in: ' + (names.join(',') || 'none') + ')';
    return;
  }
  document.getElementById('s-bridge').textContent = KNAME + ' probing…';
  sh('echo bridge-ok').then(function (probe) {
    var ok = ('' + probe).trim() === 'bridge-ok';
    var el = document.getElementById('s-bridge');
    el.innerHTML = ok ? '<span class="ok">' + KNAME + ' OK</span>'
      : '<span class="bad">WEIRD</span>';
    if (!ok) { say('bridge probe: ' + probe); return; }
    say('');
    return sh('cat ' + MOD + '/version 2>/dev/null').then(function (ver) {
      document.getElementById('s-ver').textContent = ('' + (ver || 'unknown')).trim();
      return sh('P=$(cat /data/adb/frida-ksu/frida.pid 2>/dev/null); ' +
        'if [ -n "$P" ] && tr "\\0" " " </proc/$P/cmdline 2>/dev/null | grep -q frida-server; ' +
        'then echo "PID:$P"; ' +
        'else ps -A 2>/dev/null | grep "[f]rida-server" || ps 2>/dev/null | grep "[f]rida-server"; fi');
    }).then(function (ps) {
      ps = '' + (ps || '');
      var running = /PID:\d+/.test(ps) || /[f]rida-server/.test(ps);
      document.getElementById('s-run').innerHTML = running
        ? '<span class="ok">RUNNING</span>' : '<span class="bad">STOPPED</span>';
      return sh('cat ' + MOD + '/listen_addr 2>/dev/null');
    }).then(function (listen) {
      listen = ('' + (listen || '127.0.0.1:27042')).trim();
      document.getElementById('s-listen').textContent = listen;
      document.getElementById('listen').value = listen;
      latest();
      loadLog();
    });
  });
}
function latest() {
  document.getElementById('s-latest').textContent = 'checking…';
  sh('(curl -fsSL --connect-timeout 10 https://api.github.com/repos/frida/frida/releases/latest || wget -qO- --timeout=10 https://api.github.com/repos/frida/frida/releases/latest) 2>/dev/null | grep tag_name'
  ).then(function (t) {
    var m = ('' + (t || '')).match(/"tag_name":\s*"v?([^"]+)"/);
    document.getElementById('s-latest').textContent = m ? m[1] : 'offline';
  });
}
function svc(op) {
  toast(op + '…');
  sh(op === 'stop' ? 'pkill -f frida-server' : 'sh ' + MOD + '/service.sh')
    .then(function () { setTimeout(refresh, 1500); });
}
function update() {
  say('updating, may take a while on slow networks…');
  toast('updating frida-server…');
  sh('sh ' + MOD + '/action.sh').then(function (out) {
    say(out || '(no output)');
    refresh();
  });
}
function saveListen() {
  var v = document.getElementById('listen').value.trim();
  if (!/^[0-9.]+:\d+$/.test(v)) { toast('bad address, want ip:port'); return; }
  sh("echo -n '" + v + "' > " + MOD + '/listen_addr').then(function () {
    return sh('sh ' + MOD + '/service.sh');
  }).then(function () {
    toast('saved, daemon restarted');
    setTimeout(refresh, 1500);
  });
}
function loadLog() {
  sh('tail -n 60 /data/adb/frida-ksu/frida.log 2>/dev/null').then(function (t) {
    document.getElementById('log').textContent = (t && ('' + t).trim()) || '(empty)';
  });
}
refresh();
</script>
</body>
</html>
